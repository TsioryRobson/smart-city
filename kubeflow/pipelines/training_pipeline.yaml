# PIPELINE DEFINITION
# Name: novaria-training
# Description: Entraînement des 3 détecteurs d'anomalies (en parallèle), évaluation sur les tests contrôlés et promotion dans le Model Registry MLflow.
# Inputs:
#    data_bucket: str [Default: 'novaria-data']
components:
  comp-evaluation:
    executorLabel: exec-evaluation
    inputDefinitions:
      parameters:
        data_bucket:
          description: "bucket MinIO des donn\xE9es."
          parameterType: STRING
  comp-ingestion:
    executorLabel: exec-ingestion
    inputDefinitions:
      parameters:
        data_bucket:
          description: "bucket MinIO des donn\xE9es (CSV sous ``raw/``)."
          parameterType: STRING
  comp-injection:
    executorLabel: exec-injection
    inputDefinitions:
      parameters:
        data_bucket:
          description: "bucket MinIO des donn\xE9es."
          parameterType: STRING
  comp-preparation:
    executorLabel: exec-preparation
    inputDefinitions:
      parameters:
        data_bucket:
          description: "bucket MinIO des donn\xE9es."
          parameterType: STRING
  comp-promotion:
    executorLabel: exec-promotion
    inputDefinitions:
      parameters:
        data_bucket:
          description: "bucket MinIO des donn\xE9es."
          parameterType: STRING
    outputDefinitions:
      artifacts:
        decision:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-training:
    executorLabel: exec-training
    inputDefinitions:
      parameters:
        algorithm:
          description: algorithme de ``configs/training.yaml``.
          parameterType: STRING
        data_bucket:
          description: "bucket MinIO des donn\xE9es."
          parameterType: STRING
  comp-training-2:
    executorLabel: exec-training-2
    inputDefinitions:
      parameters:
        algorithm:
          description: algorithme de ``configs/training.yaml``.
          parameterType: STRING
        data_bucket:
          description: "bucket MinIO des donn\xE9es."
          parameterType: STRING
  comp-training-3:
    executorLabel: exec-training-3
    inputDefinitions:
      parameters:
        algorithm:
          description: algorithme de ``configs/training.yaml``.
          parameterType: STRING
        data_bucket:
          description: "bucket MinIO des donn\xE9es."
          parameterType: STRING
deploymentSpec:
  executors:
    exec-evaluation:
      container:
        args:
        - --bucket
        - '{{$.inputs.parameters[''data_bucket'']}}'
        - --inputs
        - prepared
        - controlled
        - trained
        - --outputs
        - evaluated
        - --
        - evaluation
        - --controlled
        - '{controlled}'
        - --prepared
        - '{prepared}'
        - --models
        - '{trained}/isolation_forest'
        - '{trained}/local_outlier_factor'
        - '{trained}/one_class_svm'
        - --output
        - '{evaluated}'
        - --report
        - '{evaluated}/evaluation.md'
        command:
        - python
        - -m
        - novaria.pipeline.remote
        image: novaria/pipeline:0.1.0
        resources:
          cpuLimit: 2.0
          cpuRequest: 0.5
          memoryLimit: 4.0
          memoryRequest: 0.512
          resourceCpuLimit: '2'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 4G
          resourceMemoryRequest: 512M
    exec-ingestion:
      container:
        args:
        - --bucket
        - '{{$.inputs.parameters[''data_bucket'']}}'
        - --inputs
        - --outputs
        - ingested
        - --
        - ingestion
        - --source-bucket
        - '{{$.inputs.parameters[''data_bucket'']}}'
        - --output
        - '{ingested}'
        command:
        - python
        - -m
        - novaria.pipeline.remote
        image: novaria/pipeline:0.1.0
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.5
          memoryLimit: 2.0
          memoryRequest: 0.512
          resourceCpuLimit: '1'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 2G
          resourceMemoryRequest: 512M
    exec-injection:
      container:
        args:
        - --bucket
        - '{{$.inputs.parameters[''data_bucket'']}}'
        - --inputs
        - prepared
        - --outputs
        - controlled
        - --
        - injection
        - --input
        - '{prepared}'
        - --output
        - '{controlled}'
        command:
        - python
        - -m
        - novaria.pipeline.remote
        image: novaria/pipeline:0.1.0
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.5
          memoryLimit: 2.0
          memoryRequest: 0.512
          resourceCpuLimit: '1'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 2G
          resourceMemoryRequest: 512M
    exec-preparation:
      container:
        args:
        - --bucket
        - '{{$.inputs.parameters[''data_bucket'']}}'
        - --inputs
        - ingested
        - --outputs
        - prepared
        - checks
        - --
        - preparation
        - --input
        - '{ingested}'
        - --output
        - '{prepared}'
        - --report
        - '{checks}/data_quality.json'
        - --log
        - '{checks}/data_checks.log'
        - --publish-bucket
        - '{{$.inputs.parameters[''data_bucket'']}}'
        command:
        - python
        - -m
        - novaria.pipeline.remote
        image: novaria/pipeline:0.1.0
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.5
          memoryLimit: 3.0
          memoryRequest: 0.512
          resourceCpuLimit: '1'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 3G
          resourceMemoryRequest: 512M
    exec-promotion:
      container:
        args:
        - --bucket
        - '{{$.inputs.parameters[''data_bucket'']}}'
        - --inputs
        - prepared
        - controlled
        - evaluated
        - --outputs
        - --
        - promotion
        - --models
        - '{evaluated}'
        - --controlled
        - '{controlled}'
        - --prepared
        - '{prepared}'
        - --output
        - '{{$.outputs.artifacts[''decision''].path}}'
        command:
        - python
        - -m
        - novaria.pipeline.remote
        image: novaria/pipeline:0.1.0
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.5
          memoryLimit: 3.0
          memoryRequest: 0.512
          resourceCpuLimit: '1'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 3G
          resourceMemoryRequest: 512M
    exec-training:
      container:
        args:
        - --bucket
        - '{{$.inputs.parameters[''data_bucket'']}}'
        - --inputs
        - prepared
        - --outputs
        - trained
        - --group
        - '{{$.inputs.parameters[''algorithm'']}}'
        - --
        - training
        - --input
        - '{prepared}'
        - --output
        - '{trained}'
        - --report
        - '{trained}/training_comparison.md'
        - --algorithms
        - '{{$.inputs.parameters[''algorithm'']}}'
        command:
        - python
        - -m
        - novaria.pipeline.remote
        image: novaria/pipeline:0.1.0
        resources:
          cpuLimit: 2.0
          cpuRequest: 0.5
          memoryLimit: 3.0
          memoryRequest: 0.512
          resourceCpuLimit: '2'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 3G
          resourceMemoryRequest: 512M
    exec-training-2:
      container:
        args:
        - --bucket
        - '{{$.inputs.parameters[''data_bucket'']}}'
        - --inputs
        - prepared
        - --outputs
        - trained
        - --group
        - '{{$.inputs.parameters[''algorithm'']}}'
        - --
        - training
        - --input
        - '{prepared}'
        - --output
        - '{trained}'
        - --report
        - '{trained}/training_comparison.md'
        - --algorithms
        - '{{$.inputs.parameters[''algorithm'']}}'
        command:
        - python
        - -m
        - novaria.pipeline.remote
        image: novaria/pipeline:0.1.0
        resources:
          cpuLimit: 2.0
          cpuRequest: 0.5
          memoryLimit: 3.0
          memoryRequest: 0.512
          resourceCpuLimit: '2'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 3G
          resourceMemoryRequest: 512M
    exec-training-3:
      container:
        args:
        - --bucket
        - '{{$.inputs.parameters[''data_bucket'']}}'
        - --inputs
        - prepared
        - --outputs
        - trained
        - --group
        - '{{$.inputs.parameters[''algorithm'']}}'
        - --
        - training
        - --input
        - '{prepared}'
        - --output
        - '{trained}'
        - --report
        - '{trained}/training_comparison.md'
        - --algorithms
        - '{{$.inputs.parameters[''algorithm'']}}'
        command:
        - python
        - -m
        - novaria.pipeline.remote
        image: novaria/pipeline:0.1.0
        resources:
          cpuLimit: 2.0
          cpuRequest: 0.5
          memoryLimit: 3.0
          memoryRequest: 0.512
          resourceCpuLimit: '2'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 3G
          resourceMemoryRequest: 512M
pipelineInfo:
  description: "Entra\xEEnement des 3 d\xE9tecteurs d'anomalies (en parall\xE8le),\
    \ \xE9valuation sur les tests contr\xF4l\xE9s et promotion dans le Model Registry\
    \ MLflow."
  name: novaria-training
root:
  dag:
    tasks:
      evaluation:
        cachingOptions: {}
        componentRef:
          name: comp-evaluation
        dependentTasks:
        - injection
        - training
        - training-2
        - training-3
        inputs:
          parameters:
            data_bucket:
              componentInputParameter: data_bucket
        taskInfo:
          name: 4b. evaluation
      ingestion:
        cachingOptions: {}
        componentRef:
          name: comp-ingestion
        inputs:
          parameters:
            data_bucket:
              componentInputParameter: data_bucket
        taskInfo:
          name: 1. ingestion
      injection:
        cachingOptions: {}
        componentRef:
          name: comp-injection
        dependentTasks:
        - preparation
        inputs:
          parameters:
            data_bucket:
              componentInputParameter: data_bucket
        taskInfo:
          name: "4a. injection (tests contr\xF4l\xE9s)"
      preparation:
        cachingOptions: {}
        componentRef:
          name: comp-preparation
        dependentTasks:
        - ingestion
        inputs:
          parameters:
            data_bucket:
              componentInputParameter: data_bucket
        taskInfo:
          name: 2. preparation
      promotion:
        cachingOptions: {}
        componentRef:
          name: comp-promotion
        dependentTasks:
        - evaluation
        inputs:
          parameters:
            data_bucket:
              componentInputParameter: data_bucket
        taskInfo:
          name: 5. promotion
      training:
        cachingOptions: {}
        componentRef:
          name: comp-training
        dependentTasks:
        - preparation
        inputs:
          parameters:
            algorithm:
              runtimeValue:
                constant: isolation_forest
            data_bucket:
              componentInputParameter: data_bucket
        taskInfo:
          name: "3. training \xB7 Isolation Forest"
      training-2:
        cachingOptions: {}
        componentRef:
          name: comp-training-2
        dependentTasks:
        - preparation
        inputs:
          parameters:
            algorithm:
              runtimeValue:
                constant: local_outlier_factor
            data_bucket:
              componentInputParameter: data_bucket
        taskInfo:
          name: "3. training \xB7 Local Outlier Factor"
      training-3:
        cachingOptions: {}
        componentRef:
          name: comp-training-3
        dependentTasks:
        - preparation
        inputs:
          parameters:
            algorithm:
              runtimeValue:
                constant: one_class_svm
            data_bucket:
              componentInputParameter: data_bucket
        taskInfo:
          name: "3. training \xB7 One-Class SVM"
  inputDefinitions:
    parameters:
      data_bucket:
        defaultValue: novaria-data
        description: "bucket MinIO des donn\xE9es (CSV bruts, jeux publi\xE9s, dossiers\n\
          des runs)."
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.18.0
